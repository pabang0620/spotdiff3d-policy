<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 틀린그림찾기 도전장</title>
<meta property="og:title" content="3D 틀린그림찾기 도전장">
<meta property="og:description" content="친구가 보낸 기록에 도전해 보세요 · Beat your friend's time">
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4ede1;--card:#fffbf4;--ink:#4a3a2e;--soft:#7f6b59;--green:#61946b;--orange:#cc7a52;--line:#dbcfbd}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1915;--card:#2a241e;--ink:#f0e6d8;--soft:#b9a993;--line:#4a4036}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
main{max-width:460px;margin:0 auto;padding:32px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;text-align:center}
h1{font-size:1.5rem;margin:0 0 6px}
.from{color:var(--soft);margin:0 0 18px}
.time{font-size:3rem;font-weight:700;color:var(--orange);margin:6px 0 2px;letter-spacing:.02em}
.sub{color:var(--soft);margin:0 0 22px}
a.btn{display:block;text-decoration:none;border-radius:16px;padding:15px 12px;font-weight:700;margin:10px 0}
a.go{background:var(--green);color:#fff}
a.store{background:transparent;color:var(--ink);border:2px solid var(--line)}
.code{margin-top:18px;color:var(--soft);font-size:.95rem}
.code b{color:var(--ink);letter-spacing:.15em;font-size:1.2rem}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="t"></h1>
    <p class="from" id="from"></p>
    <div class="time" id="time">--:--</div>
    <p class="sub" id="sub"></p>
    <a class="btn go" id="go" href="#"></a>
    <a class="btn store" id="store" href="https://play.google.com/store/apps/details?id=com.nekolab.spotdiff3d"></a>
    <p class="code" id="codeline"></p>
  </div>
</main>
<script>
(function () {
  var URL = 'https://qcjskzblzvmepdazoobt.supabase.co/rest/v1/rpc/get_challenge';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjanNremJsenZtZXBkYXpvb2J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgyNjAxOTgsImV4cCI6MjA3MzgzNjE5OH0.vIGymiemOp120InDukrUcJrb5iga3ceQx_ylKccmM9A';
  var ko = (navigator.language || '').toLowerCase().indexOf('ko') === 0;
  var T = ko ? {
    title: '3D 틀린그림찾기 도전장', from: '{0}의 도전장', sub: '이 기록보다 빨리 다 찾아보세요', go: '게임에서 도전하기', store: 'Google Play에서 받기',
    code: '게임 지도 화면의 "도전장 코드"에 <b>{0}</b> 입력', none: '도전장을 찾을 수 없어요', stage: '{0}단계',
    adj: ['졸린','포근한','느긋한','수줍은','용감한','반짝이는','배고픈','행복한','조용한','씩씩한','말랑한','꼼꼼한','신난','귀여운','다정한','엉뚱한'],
    ani: ['고양이','강아지','토끼','여우','곰','부엉이','판다','고슴도치','펭귄','너구리','다람쥐','물개','코알라','수달','병아리','오리']
  } : {
    title: 'Spot the Difference 3D Challenge', from: 'A challenge from {0}', sub: 'Can you find them all faster?', go: 'Play the challenge', store: 'Get it on Google Play',
    code: 'Or type <b>{0}</b> in "Challenge code" on the map', none: 'Challenge not found', stage: 'Stage {0}',
    adj: ['Sleepy','Cozy','Easygoing','Shy','Brave','Sparkly','Hungry','Happy','Quiet','Plucky','Squishy','Careful','Excited','Cute','Kind','Quirky'],
    ani: ['Cat','Puppy','Bunny','Fox','Bear','Owl','Panda','Hedgehog','Penguin','Raccoon','Squirrel','Seal','Koala','Otter','Chick','Duck']
  };
  function f(s, a) { return s.replace('{0}', a); }
  function el(id) { return document.getElementById(id); }
  document.documentElement.lang = ko ? 'ko' : 'en';
  document.title = T.title;
  el('t').textContent = T.title; el('sub').textContent = T.sub; el('go').textContent = T.go; el('store').textContent = T.store;
  var code = ((new URLSearchParams(location.search)).get('k') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var android = /android/i.test(navigator.userAgent);
  var store = 'https://play.google.com/store/apps/details?id=com.nekolab.spotdiff3d';
  el('go').href = android
    ? 'intent://c/' + code + '#Intent;scheme=spotdiff3d;package=com.nekolab.spotdiff3d;S.browser_fallback_url=' + encodeURIComponent(store) + ';end'
    : store;
  el('codeline').innerHTML = code ? f(T.code, code) : '';
  if (!code) { el('from').textContent = T.none; return; }
  fetch(URL, { method: 'POST', headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Profile': 'spotdiff', 'Content-Type': 'application/json' },
               body: JSON.stringify({ p_code: code }) })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (c) {
      if (!c) { el('from').textContent = T.none; return; }
      var name = T.adj[c.adj % 16] + ' ' + T.ani[c.animal % 16] + ' #' + c.tag;
      el('from').textContent = f(T.from, name) + ' · ' + f(T.stage, c.stage);
      var s = Math.ceil(c.ms / 1000);
      el('time').textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
    })
    .catch(function () {});
})();
</script>
</body>
</html>
